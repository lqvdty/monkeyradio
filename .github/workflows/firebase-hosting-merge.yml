# Deploys the site to Firebase Hosting on every push to main.
# Requires repo secret FIREBASE_SERVICE_ACCOUNT (a Firebase service-account JSON
# key with the "Firebase Hosting Admin" role). Update `projectId` below to match
# your actual Firebase project id if it is not "monkey-radio-india".
name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: monkey-radio-india
