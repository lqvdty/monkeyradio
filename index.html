<style>
html,body{margin:0;padding:0}
body{background:#f3f2f2;color:#201e1d;font-family:"Archivo",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:#ae1800;text-decoration:none}
a:hover{color:#ec3013}
::selection{background:#ffe0d9;color:#201e1d}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #ec3013;outline-offset:2px}
.mri-row{scrollbar-width:none;-ms-overflow-style:none}
.mri-row::-webkit-scrollbar{display:none}
@keyframes mri-blink{0%,60%{opacity:1}80%,100%{opacity:.15}}
@keyframes mri-spin{to{transform:rotate(360deg)}}
@keyframes mri-toast{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes mri-sheet{from{transform:translateY(14px);opacity:.4}to{transform:translateY(0);opacity:1}}
@keyframes mri-herofade{from{opacity:0}to{opacity:1}}
/* Always mounted (see src/app.jsx) so it stays in the accessibility tree -
   a live region created at the same instant as its content is commonly
   missed by screen readers entirely. Idle state is fully transparent and
   already out of flow (position:fixed), so nothing is lost by keeping it
   in the DOM between toasts. */
.mri-toast{opacity:0;transition:opacity .15s ease}
.mri-toast[data-show="1"]{opacity:1;animation:mri-toast .2s ease-out}
/* Hero rotation dots: visual size stays a small 10px mark inside a 26px
   button, but the tappable area is padded out toward the 44px minimum. */
.mri-herodot{position:relative}
.mri-herodot::after{content:"";position:absolute;inset:-8px}
/* Interaction states: the design's style-hover / style-active, as real rules. */
.h-accent-bg:hover{background:#dd2b0f !important}
.h-accent-bg:active{background:#ae1800 !important}
.h-dark-accent:hover{background:#ec3013 !important}
.h-accent-text:hover{color:#ec3013 !important}
.h-accent-border:hover{border-color:#ec3013 !important}
.h-accent-outline:hover{border-color:#ec3013 !important;color:#ec3013 !important}
.h-invert:hover{background:#201e1d !important;color:#f3f2f2 !important}
.h-fade:hover{opacity:.72}
.h-row:hover{background:#eae9e9 !important}
.h-close:hover{background:#ec3013 !important;border-color:#ec3013 !important;color:#fff !important}
/* Ambient-mode exit: a bare X, no chrome. Quiet by default, full strength
   on hover / keyboard focus. */
.mri-ambclose{opacity:.6;transition:opacity .15s ease}
.mri-ambclose:hover,.mri-ambclose:focus-visible{opacity:1}
/* Album art (see ArtImg / ArtBg in src/app.jsx): a bundled placeholder is
   painted at the final box size first, then the real cover fades in once it
   has decoded, so nothing around it reflows while the network is slow. */
.mri-artimg{transition:opacity .35s ease}
.mri-artimg[data-art="wait"]{opacity:.7}
/* Landing cards: on hover the cover slowly zooms and the runtime chip
   flips to accent. */
.mri-art img{transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.mri-art .mri-artimg{transition:transform .5s cubic-bezier(.2,.7,.2,1),opacity .35s ease}
.mri-card:hover .mri-art img{transform:scale(1.06)}
.mri-card:hover .mri-arttag{background:#ec3013 !important}
/* Vinyl-sleeve treatment: a translucent orange wash (the "Tune in"
   accent) tints — not masks — the cover art. */
.mri-card .mri-art::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:#ec3013;opacity:.20;
  transition:none;
}
/* on hover the wash eases away so the true cover art comes through;
   on mouse-out it snaps straight back (transition lives on :hover only) */
.mri-card:hover .mri-art::before{opacity:0;transition:opacity .5s cubic-bezier(.2,.7,.2,1)}
/* keep the runtime chip legible above the wash */
.mri-card .mri-art .mri-arttag{z-index:2}
@media (prefers-reduced-motion:reduce){
  .mri-art img{transition:none}
  .mri-artimg,.mri-art .mri-artimg{transition:none}
  .mri-artimg[data-art="wait"]{opacity:1}
  .mri-card:hover .mri-art img{transform:none}
  .mri-card .mri-art::before{transition:none}
  .mri-heroart,.mri-heroart-m{animation:none}
}
#root{min-height:100vh;min-height:100dvh}

/* Hero: the featured card rotates, so the title / blurb / stat
   zones are locked to a fixed height. Nothing below them (bar,
   stats, buttons, dot nav) shifts vertically between cards, on any
   viewport. line-height 1.1 + a bottom pad keeps descenders (g, y,
   p) inside the clip box. */
.mri-herohead{font-size:clamp(32px,4.6vw,62px);line-height:1.1;height:2.35em;padding-bottom:.15em;max-width:16ch;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.mri-herohead h1{font-weight:800;font-size:1em;line-height:inherit;letter-spacing:-.035em;margin:0;text-wrap:pretty;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.mri-heroblurb{font:500 14.5px/1.5 "Archivo",sans-serif;color:#605d5d;margin:12px 0 16px;max-width:44ch;height:3em;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.mri-herogreet{font:600 11px "Archivo",sans-serif;letter-spacing:.04em;color:#6a6666;margin-bottom:10px}
.mri-herolive{max-width:44ch;margin:0 0 24px;min-height:26px}
.mri-herobar{height:4px;background:#ded9d9;overflow:hidden}
.mri-herobar>span{display:block;height:100%;background:#201e1d}
.mri-herolivemeta{display:flex;align-items:baseline;gap:16px;margin-top:8px;font:600 10px "Archivo",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#6a6666}
.mri-herolivemeta>span:first-child{flex:none}
.mri-heroup{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.mri-herometa{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 12px;margin-bottom:30px;padding-top:16px;border-top:1px solid #d7d3d3;font:600 10px "Archivo",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#6a6666}
.mri-herometa>span{min-width:0;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mri-herometa>span+span{padding-left:12px;border-left:1px solid #d7d3d3}
.mri-heroart-m{display:none}
/* Hero cover: a fade as the 5 featured slides rotate. */
.mri-heroart,.mri-heroart-m{animation:mri-herofade .45s ease}

/* ============================================================
   Responsive layer. Desktop ( > 1080px ) renders exactly as
   authored; every rule below is scoped to a breakpoint and
   only reshapes tablet / phone. Overrides use !important
   because the base layout is authored as inline styles.
   ============================================================ */
#root{overflow-x:clip}
#root img{max-width:100%}
#root h1,#root h2,#root h3{overflow-wrap:anywhere}
.mri-app{min-height:100dvh}

/* ---- Tablet ( <= 1080px ) ---- */
@media (max-width:1080px){
  .mri-backdrop{padding:16px !important}
  .mri-modalhead{padding:24px !important;gap:24px !important}
  .mri-modalhead h2{font-size:24px !important}

  /* Player dock: this row was authored for desktop's 1560px max-width and
     wraps its trailing controls onto an orphaned second row well before
     tablet width. Narrow every element that can afford it instead of
     letting the row wrap. */
  .mri-dockrow{flex-wrap:nowrap !important;gap:8px !important}
  .mri-nowmeta{min-width:0 !important;max-width:150px !important}
  .mri-sleepbtn{padding:10px !important}
  .mri-sleeplabel{display:none}
  .mri-dockbtn{width:32px !important;height:32px !important}
}

/* ---- Phone ( <= 720px ) ---- */
@media (max-width:720px){
  /* Shelf strip header: allow it to breathe and drop the
     desktop-only scroll arrows (touch users swipe). */
  .mri-shelfhead{flex-wrap:wrap !important;gap:8px 14px !important}
  .mri-shelfhead h2{font-size:17px !important}
  .mri-shelfarrow{display:none !important}
  .mri-seeall{margin-left:auto !important;padding:0 !important}

  /* Stat band -> tidy 2x2 with real internal rules. */
  .mri-statbar{grid-template-columns:1fr 1fr !important}
  .mri-statbar>div{padding:18px 16px !important;border-left:1px solid #d7d3d3}
  .mri-statbar>div:nth-child(2n+1){border-left:0 !important}
  .mri-statbar>div:nth-child(n+3){border-top:1px solid #d7d3d3}

  /* Stacked hero flows greeting -> kicker -> title -> blurb -> bar
     -> cover -> meta. The cover moves inline (mri-heroart-m) so it
     sits with the text it describes; the desktop right-column cover
     is dropped. Drop the fixed-height title reservation too: with
     vertical flow there is nothing below it that must stay put. */
  .mri-herohead{height:auto !important;padding-bottom:0 !important;display:block !important;overflow:visible !important}
  .mri-herohead h1{display:block !important;-webkit-line-clamp:unset !important;overflow:visible !important}
  .mri-heroblurb{height:auto !important;display:block !important;-webkit-line-clamp:unset !important;overflow:visible !important;margin:8px 0 0 !important}
  .mri-herolive{margin:16px 0 0 !important}
  /* Keep Play + Save side by side on one row; never let them wrap apart. */
  .mri-herobtns{flex-wrap:nowrap !important}
  .mri-herobtns>button{min-width:0;white-space:nowrap}
  .mri-heroart{display:none !important}
  .mri-heroart-m{display:block;width:100%;max-width:min(86vw,340px);aspect-ratio:1;margin:18px auto 22px;background-size:cover;background-position:center;background-color:#eae9e9;border:1px solid #d7d3d3}

  /* Listen-by-mood: the inline vertical-divider row wraps into a
     broken grid on phones. Recast the label as a standalone
     heading and the moods as a proper wrapped chip set. */
  .mri-moodbar{gap:8px !important;padding:16px 0 !important}
  .mri-moodbar>span{flex:1 0 100% !important;margin:0 0 2px !important}
  .mri-moodbar>button{border:1px solid #d7d3d3 !important;padding:8px 12px !important;font-size:11px !important;letter-spacing:.08em;text-transform:uppercase}

  /* Browse toolbar: kill the invisible pusher so the sort /
     clear controls stay on the chip flow instead of jumping. */
  .mri-filterbar{gap:8px !important}
  .mri-filterbar .mri-spacer{display:none !important}

  /* Selectors list: once a row wraps, the numeric columns
     shouldn't sit hard-right on their own line, and an empty
     tag slot shouldn't hold space. */
  .mri-djrow{gap:4px 14px !important}
  .mri-djrow>div:nth-child(4),.mri-djrow>div:nth-child(5){text-align:left !important;min-width:0 !important}
  .mri-djrow>div:nth-child(3):empty{display:none !important}

  /* Saved: keep the three tabs on one line. */
  .mri-tabs button{padding:11px 13px !important;letter-spacing:.07em !important;white-space:nowrap}

  /* Inline (mobile) detail: cap the cover so it doesn't
     push everything below the fold. */
  .mri-detailart{max-height:62vh !important}

  /* Player dock: let the track title use the free width and
     force the widget onto its own full-width line. */
  .mri-nowmeta{max-width:none !important;flex:1 1 140px !important}
}

/* ============================================================
   Mobile Now-Playing player. Rendered only at bp:sm. One node,
   two states via [data-exp]: a 60px mini bar, or a full-screen
   sheet. The .mp-body wrapper (which holds the single, persistent
   Mixcloud <iframe>) is never display:none. Collapsed, it is
   clipped to nothing so audio keeps running without a reload.
   ============================================================ */
.mri-mp{position:fixed;left:0;right:0;bottom:0;z-index:75;background:#f3f2f2;border-top:2px solid #201e1d;color:#201e1d}
.mri-mp[data-exp="1"]{top:0;border-top:0;display:flex;flex-direction:column}
.mri-mp button{font-family:'Archivo',sans-serif}

/* mini bar */
.mri-mp .mp-mini{display:flex;align-items:center;gap:6px;height:60px;padding:0 8px}
.mri-mp[data-exp="1"] .mp-mini{display:none}
.mp-mthumb{width:40px;height:40px;flex:none;border:1px solid #d7d3d3;background-size:cover;background-position:center;background-color:#eae9e9;padding:0;cursor:pointer}
.mp-mmeta{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:none;border:0;padding:0 4px 0 2px;cursor:pointer;text-align:left}
.mp-mtitle{font-weight:600;font-size:13px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.mp-mdj{font-weight:500;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#6a6666;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
/* every mini-bar control is the same 40px square. The visual size stays as
   designed; ::after pads out the actual tappable area toward the 44px
   platform minimum (Stop sits right next to Play/Pause here - the real
   cost of a control this size is a mis-tap between the two). */
.mp-mthumb,.mp-mbtn{position:relative}
.mp-mthumb::after,.mp-mbtn::after{content:"";position:absolute;inset:-4px}
.mp-mbtn{width:40px;height:40px;flex:none;display:flex;align-items:center;justify-content:center;border:1px solid #201e1d;border-radius:0;background:none;color:#201e1d;cursor:pointer;padding:0}
.mp-mbtn.is-primary{background:#201e1d;color:#f3f2f2}
.mp-mbtn.is-primary:active{background:#ec3013;border-color:#ec3013}
.mp-mbtn.is-close{margin-left:2px}
@media (max-width:360px){
  .mri-mp .mp-mini{gap:5px;padding:0 6px}
  .mp-mthumb,.mp-mbtn{width:34px;height:34px}
}

/* sheet header */
.mri-mp .mp-head{display:none}
.mri-mp[data-exp="1"] .mp-head{display:flex;align-items:center;gap:12px;padding:12px clamp(16px,4vw,22px);border-bottom:1px solid #d7d3d3;flex:none}
.mp-hbtn{width:34px;height:34px;flex:none;display:flex;align-items:center;justify-content:center;border:1px solid #201e1d;background:none;color:#201e1d;cursor:pointer}
.mp-kicker{flex:1;font-weight:600;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#6a6666}

/* body (persistent iframe host) */
.mri-mp .mp-body{position:absolute;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none;clip:rect(0 0 0 0)}
.mri-mp[data-exp="1"] .mp-body{position:static;width:auto;height:auto;overflow-y:auto;opacity:1;pointer-events:auto;clip:auto;flex:1;display:flex;flex-direction:column;gap:16px;padding:clamp(16px,4vw,22px);padding-bottom:calc(28px + env(safe-area-inset-bottom));animation:mri-sheet .22s ease-out}
.mp-cover{width:100%;max-width:min(74vw,360px)}
.mp-when{font-weight:600;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#ae1800;margin-bottom:10px}
.mp-title{font-weight:800;font-size:clamp(22px,6.4vw,30px);line-height:1.08;letter-spacing:-.03em;margin:0 0 10px;overflow-wrap:anywhere}
.mp-dj{font-weight:500;font-size:14px;color:#444141}
.mp-dj strong{font-weight:700;color:#201e1d}
.mp-next{font-weight:600;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#6a6666;margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-scrub{border-top:2px solid #201e1d;padding-top:16px}
.mp-radio{display:flex;align-items:center;gap:10px;width:100%;border:1px solid #201e1d;background:none;color:#201e1d;padding:14px 16px;font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.mp-radio[data-on="1"]{background:#201e1d;color:#f3f2f2}
.mp-row3{display:flex;gap:8px;flex-wrap:wrap}
.mp-abtn{flex:1 1 72px;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid #201e1d;background:none;color:#201e1d;padding:13px 6px;font-weight:600;font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.mp-abtn:active{background:#201e1d;color:#f3f2f2}

/* ---- Small phone ( <= 480px ): collapse the wordmark to the
   logo mark so logo + Tune in + menu hold one clean header line. */
@media (max-width:480px){
  .mri-brand{display:none !important}
}

/* ---- Small phone ( <= 380px ) ---- */
@media (max-width:380px){
  .mri-brand{font-size:12px !important}
  .mri-herohead{font-size:26px !important}
  .mri-detailstats>div{padding-left:10px !important}
  .mri-detailstats>div:first-child{padding-left:0 !important}
  .mri-detailstats>div>div:first-child{font-size:17px !important}
  .mri-detailstats>div>div:last-child{letter-spacing:.05em !important}
}
</style>

<script src="assets/app.js"></script>
<!-- Ambient-mode WebGL backdrop (ShaderGradient). Self-contained ES module;
     its heavy dependency tree is only fetched when ambient mode opens. -->
<script type="module" src="assets/shader-bg.js"></script>
<script>
/* PWA: register the service worker so the app installs and its shell
   loads offline. https / localhost only (the API needs a secure context). */
(function () {
  if (!('serviceWorker' in navigator)) return;
  var ok = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  if (!ok) return;
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('/sw.js').catch(function () {});
  });
})();
</script>
</body>
